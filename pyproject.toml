[tool.poetry]
name = "dronechase"
version = "0.1.0"
description = "Deep Reinforcement Learning Applied for Threat Engagement"
authors = ["DaviGuanabara <davi_guanabara@live.com>"]
readme = "README.md"
packages = [
    { include = "core", from = "src" },
    { include = "threatengage", from = "src" },
    { include = "threatsense", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
stable-baselines3 = "*"
h5py = "*"
tqdm = ">=4.67.1,<5.0.0"
optuna = ">=4.3.0,<5.0.0"
rich = ">=14.1.0,<15.0.0"
pynput = ">=1.8.1,<2.0.0"
numpy = "<=2.2"
torch-geometric = ">=2.7.0,<3.0.0"
torch = "2.11.0"
torchvision = "0.26.0"
numba = ">=0.65.1,<0.66.0"
scipy = ">=1.11.4,<2.0.0"
openpyxl = ">=3.1.5,<4.0.0"
tensorboard = ">=2.19.0,<3.0.0"

[tool.poetry.extras]
viz = ["seaborn", "tensorboard"]
interactive = ["pynput"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# IMPORTANT:
# pybullet must be installed via conda-forge BEFORE installing pyflyt.
# Reason: pybullet fails to build on macOS (clang / PEP517 issues).
#
# Steps:
#   conda install --solver=classic -c conda-forge pybullet
#   pip install pyflyt==0.29.0
# Poetry version tested: 2.3.4
